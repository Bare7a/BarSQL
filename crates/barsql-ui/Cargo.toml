[package]
name = "barsql-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Per-engine UI scenarios. They need the compose databases (cargo xtask e2e up).
e2e = []
snapshot = ["gpui-kit/test-support", "dep:image"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
dirs.workspace = true
futures-util.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
lsp-types.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tree-sitter-json.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
barsql-app.workspace = true
barsql-core.workspace = true
barsql-db.workspace = true
barsql-io.workspace = true
barsql-sql.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
