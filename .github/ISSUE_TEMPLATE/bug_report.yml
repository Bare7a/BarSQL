name: 🐛 Bug report
description: Something in BarSQL doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Screenshots help.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to a PostgreSQL 17 database
        2. Run …
        3. See …

  - type: input
    id: version
    attributes:
      label: BarSQL version
      description: Help → About BarSQL, then the copy button next to the version.
      placeholder: BarSQL 1.2.2 (macOS arm64)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: With the display scaling, if it isn't 100%.
      placeholder: macOS 15, Windows 11 at 150%, Ubuntu 24.04 (Wayland)
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installed from
      description: Updates work differently for each download.
      options:
        - Windows installer
        - Windows zip or BarSQL.exe
        - macOS zip or dmg
        - Linux tar.gz or standalone binary
        - AppImage
        - deb, rpm or pkg.tar.zst
        - Built from source

  - type: dropdown
    id: database
    attributes:
      label: Database
      multiple: true
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQLite
        - SQL Server
        - ClickHouse
        - Turso / libSQL
        - Not database-specific

  - type: input
    id: database-version
    attributes:
      label: Database version
      placeholder: PostgreSQL 17.2, MySQL 8.4, SQL Server 2022

  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      description: Paste it as text. If BarSQL closed by itself or said it hit a bug, add `crash.log` from the [data folder](https://github.com/Bare7a/BarSQL/blob/master/guide/app.md#-portable-by-design). For an update or AI assistant problem, add the end of `update.log` or `mcp.log`. Leave out passwords, connection strings and private data.
      render: text
