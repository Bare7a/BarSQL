name: ✨ Feature request
description: An idea that would make BarSQL better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like BarSQL to do?
      description: The problem it solves and how you picture it working. Mention any tool that already does it well.
    validations:
      required: true

  - type: checkboxes
    id: build
    attributes:
      label: Contributing
      description: For a big change, wait for a reply on the approach before you start.
      options:
        - label: I'd like to build this myself
