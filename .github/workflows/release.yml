name: Release BarSQL

# The updater reads these releases, so keep the asset names and one-entry archives stable. Nothing is published
# unless the full test suite passes on Linux, macOS and Windows.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.0.0; leave empty to build the packages without publishing'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Match the tag against Cargo.toml
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${INPUT_TAG// /}"
            if [ -n "$tag" ] && [ "${tag#v}" = "$tag" ]; then
              tag="v$tag"
            fi
          fi
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::The tag $tag does not match Cargo.toml ($version). Run cargo xtask bump-version first."
            exit 1
          fi
          # Never republish a version from a different commit.
          if [ -n "$tag" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            existing="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points at ${existing:0:7}, not this commit. Run cargo xtask bump-version first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  tests:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/test.yml
    with:
      suite: all

  build:
    needs: version
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          # Built in an Ubuntu 22.04 container so the binaries also run on distros with an older glibc.
          - os: ubuntu-24.04
            target: linux
            container: ubuntu:22.04
            artifact: dist-linux
          - os: ubuntu-24.04-arm
            target: linux
            container: ubuntu:22.04
            artifact: dist-linux-arm64
          - os: windows-latest
            target: windows
            artifact: dist-windows
          - os: macos-latest
            target: macos
            artifact: dist-macos
    runs-on: ${{ matrix.os }}
    # Windows and macOS have none, so they build on the runner itself.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7

      # The bare image has no compilers, pkg-config, certificates, Rust or the file command appimagetool runs.
      - name: Install the build tools, GPUI's libraries and rustup
        if: matrix.target == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y build-essential clang pkg-config curl ca-certificates file libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add the macOS targets
        if: matrix.target == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # A tag can only use its own caches and master's, so only master saves one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # package-linux.sh makes the deb and the rpm on x86-64 only.
      - name: Install cargo-deb and cargo-generate-rpm
        if: matrix.target == 'linux' && runner.arch == 'X64'
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: Install linuxdeploy
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$(uname -m).AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy"
          echo "LINUXDEPLOY=$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_ENV"

      - name: Install NSIS
        if: matrix.target == 'windows'
        uses: negrutiu/nsis-install@v3

      # The README promises a notarized Mac app, so a release here can't go out without these secrets. A fork or a
      # build-only run without them signs the app ad-hoc and skips notarization.
      - name: Import the Developer ID certificate
        if: matrix.target == 'macos'
        env:
          RELEASING: ${{ needs.version.outputs.tag != '' && github.repository == 'Bare7a/BarSQL' }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          missing() {
            if [ "$RELEASING" = true ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }
          if [ -z "$MACOS_CERTIFICATE" ]; then
            missing "No MACOS_CERTIFICATE secret, so the macOS app would be signed ad-hoc and not notarized."
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          # Recorded at once, so the cleanup step deletes it even when the import below fails.
          echo "BARSQL_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # A .p12 from Keychain Access leaves out Apple's intermediate, and the runner image may not have it either.
          security import packaging/macos/DeveloperIDG2CA.cer -k "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          # The SHA-1 hash rather than the name, which codesign refuses when two certificates share it, as after a renewal.
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: /{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          echo "BARSQL_MACOS_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -z "$APPLE_API_KEY" ]; then
            missing "No APPLE_API_KEY secret, so the macOS app would be signed but not notarized, and Gatekeeper would block it."
          fi
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::APPLE_API_KEY needs the APPLE_API_KEY_ID and APPLE_API_ISSUER secrets too."
            exit 1
          fi
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "BARSQL_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "BARSQL_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "BARSQL_NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: scripts/package-${{ matrix.target }}.sh

      # A newer container image would raise the glibc it needs and drop the distros still on 2.35, like Ubuntu 22.04.
      - name: Check the libraries the Linux binary needs
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          readelf -d target/package/linux/BarSQL | grep NEEDED
          glibc="$(objdump -T target/package/linux/BarSQL | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)"
          echo "Needs $glibc"
          if [ "$(printf '%s\n' "$glibc" GLIBC_2.35 | sort -V | tail -n1)" != GLIBC_2.35 ]; then
            echo "::error::The binary needs $glibc, newer than Ubuntu 22.04's GLIBC_2.35."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/package/dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Delete the signing keychain and the keys
        if: always() && matrix.target == 'macos'
        run: |
          if [ -n "${BARSQL_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$BARSQL_SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8"

  # makepkg needs Arch and refuses to run as root.
  arch:
    needs: [version, build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist-linux
          path: dist-linux

      - name: Package
        env:
          BARSQL_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # makepkg leaves zstd at level 3; Arch's own packages use --ultra -20.
          echo 'COMPRESSZST=(zstd -c -T0 --ultra -20 -)' >> /etc/makepkg.conf
          stage="$(mktemp -d)"
          cp packaging/linux/PKGBUILD packaging/linux/BarSQL.desktop packaging/linux/barsql-*.png "$stage/"
          install -m 755 dist-linux/BarSQL "$stage/BarSQL"
          useradd --create-home builder
          chown -R builder "$stage"
          (cd "$stage" && runuser -u builder -- env BARSQL_VERSION="$BARSQL_VERSION" makepkg --nodeps --noconfirm)
          mkdir -p dist
          mv "$stage/barsql-$BARSQL_VERSION-1-x86_64.pkg.tar.zst" dist/BarSQL.pkg.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: dist-arch
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, tests, build, arch]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # The updater verifies its download against this file.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # Every file the release publishes, SHA256SUMS included, so gh attestation verify <file> --repo Bare7a/BarSQL
      # confirms any of them came from this workflow.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BarSQL ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          draft: false

  # github.token can't push to another repository, so the tap takes a deploy key.
  homebrew:
    needs: [version, release]
    if: github.repository == 'Bare7a/BarSQL'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Bare7a/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sums="$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output -)"
          digest() { awk -v file="$1" '$2 == file { print $1 }' <<<"$sums"; }
          sed -e "s/@VERSION@/$VERSION/" \
            -e "s/@SHA256_ARM64@/$(digest BarSQL-darwin-arm64.zip)/" \
            -e "s/@SHA256_AMD64@/$(digest BarSQL-darwin-amd64.zip)/" \
            packaging/homebrew/barsql.rb > tap/Casks/barsql.rb
          cd tap
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "barsql $VERSION"
          git push
