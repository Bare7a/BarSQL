[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "1.0.2"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
barsql-app = { path = "crates/barsql-app" }
barsql-core = { path = "crates/barsql-core" }
barsql-db = { path = "crates/barsql-db" }
barsql-io = { path = "crates/barsql-io" }
barsql-sql = { path = "crates/barsql-sql" }
barsql-storage = { path = "crates/barsql-storage" }
barsql-ui = { path = "crates/barsql-ui" }

anyhow = "1"
async-channel = "2"
bytes = "1"
dirs = "7"
flate2 = "1"
futures-util = "0.3"
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-sql", "tree-sitter-html"] }
hex = "0.4"
interprocess = "2"
jiff = "0.2"
libc = "0.2"
lsp-types = "=0.97.0"
regex = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring", "client_ed25519"] }
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype", "hooks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11"
sqlformat = "0.5"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
# Same version as GPUI Kit's JSON grammar, since only its highlight query is replaced.
tree-sitter-json = "=0.24.8"
unicode-normalization = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

# No debug info for dependencies. Keeps target/ much smaller and links faster.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
