# Databases for the E2E suites. Non-default ports, so they don't clash with a local Postgres or MySQL:
#
#   PostgreSQL -> 55432
#   MySQL      -> 33306
#   MariaDB    -> 33307
#   libSQL     -> 38080   (sqld, the server Turso runs; HTTP)
#   ClickHouse -> 38123   (HTTP)
#   SQL Server -> 31433   (only with the mssql profile: BARSQL_E2E_MSSQL=1 for xtask)
#
# The tests use these ports and credentials unless BARSQL_E2E_PG_PORT and friends say otherwise.
#
#   cargo xtask e2e up      # COMPOSE="podman compose" for Podman
#   cargo xtask e2e         # driver, app and per-engine UI suites
#   cargo xtask e2e down    # or `cargo xtask e2e all` for up, run and down in one go
#
# `up --wait` returns once every healthcheck passes.

name: barsql-e2e

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barsql_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barsql_test"]
      interval: 3s
      timeout: 5s
      retries: 20
    tmpfs:
      # tmpfs is faster and leaves nothing to clean up between runs.
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barsql_test
    ports:
      - "33306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: barsql_test
    ports:
      - "33307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  turso:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports:
      - "38080:8080"
    healthcheck:
      # The image has no curl, but bash can open a TCP connection.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/sqld

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_DB: barsql_test
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "38123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse", "client", "--password", "clickhouse", "-q", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    tmpfs:
      - /var/lib/clickhouse

  # amd64 only, and big, so it starts only with the mssql profile. On arm64, xtask swaps in Azure SQL Edge, which runs
  # the same engine natively. SQL Server can't keep its files on tmpfs.
  mssql:
    profiles: [mssql]
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    platform: ${MSSQL_PLATFORM:-linux/amd64}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: BarSQL-e2e-Passw0rd
      MSSQL_PID: Developer
    ports:
      - "31433:1433"
    healthcheck:
      # Azure SQL Edge has no sqlcmd. The suites retry their first login while the server finishes starting.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1433"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
